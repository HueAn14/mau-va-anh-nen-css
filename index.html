<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Màu nền và Ảnh nền CSS</title>
    <!-- Kết nối với file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề <h1> -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn <p> -->
    <p class="description">
        Trang web này được xây dựng để thực hành các thuộc tính định dạng nền bao gồm màu nền (background-color) và ảnh nền (background-image) trong CSS.
    </p>

    <!-- Khối <div> chứa nội dung quan trọng -->
    <div class="card-box">
        <h2>Thông Tin Quan Trọng</h2>
        <p>Đây là khối nội dung nổi bật được áp dụng hình ảnh làm nền và được căn giữa trực quan.</p>
    </div>

</body>
</html>
